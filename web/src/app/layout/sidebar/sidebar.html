<aside class="sidebar">
  <a class="logo" routerLink="/today" aria-label="Jotern">
    <svg class="logo-mark" width="36" height="36" viewBox="0 0 96 96" aria-hidden="true">
      <rect x="2" y="2" width="92" height="92" rx="24" fill="#1B2A5C" />
      <path d="M55 38 V62 C55 73 47 77 38 72" fill="none" stroke="#F3F5FA" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="55" cy="22" r="7.5" fill="#FFD84A" />
    </svg>
    <span class="logo-word"><span class="logo-highlight">jot</span>ern</span>
  </a>
  <nav class="nav" aria-label="Primary navigation">
    @for (item of items; track item.path) {
      <a class="nav-item" [routerLink]="item.path" routerLinkActive="active">
        <app-icon [name]="item.icon" />
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>
  <div class="offline-status">
    <span class="offline-dot"></span>
    <span>Offline. Saved on this laptop.</span>
  </div>
</aside>
