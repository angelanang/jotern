<aside class="sidebar">
  <a href="/" class="brand"></a>

  <nav class="nav">
    @for (link of links; track link.link) {
      <a [routerLink]="link.link" class="nav-link" routerLinkActive="active">
        <span class="nav-icon jt-icon" [class]="'jt-icon--' + link.icon"></span>
        <span class="nav-label">{{ link.label }}</span>
      </a>
    }
  </nav>

  <div class="line"></div>
  <section>
    <div class="connection-status"></div>
    Offline. Saved on this laptop
  </section>
</aside>
