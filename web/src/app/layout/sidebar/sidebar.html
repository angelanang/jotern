<aside class="sidebar">
  <a href="/" class="brand">
    <img src="/brand/jotern-lockup-transparent-light.svg" alt="Jotern" class="logo" />
  </a>

  <nav class="nav">
    @for (link of links; track link.link) {
      <a [routerLink]="link.link" class="nav-link" routerLinkActive="active">
        <span></span>
        <span class="nav-label">{{ link.label }}</span>
      </a>
    }
  </nav>
</aside>
