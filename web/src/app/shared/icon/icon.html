<svg [attr.width]="size()" [attr.height]="size()" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  @switch (name()) {
    @case ('today') {
      <svg:rect x="3" y="5" width="18" height="16" rx="2" />
      <svg:path d="M16 3v4M8 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01" />
    }
    @case ('week') {
      <svg:path d="M4 5h16v15H4zM8 3v4M16 3v4M4 9h16" />
      <svg:path d="M8 13h2M14 13h2M8 17h2M14 17h2" />
    }
    @case ('report') { <svg:path d="M6 3h9l4 4v14H6zM15 3v5h4M9 12h6M9 16h6" /> }
    @case ('setup') {
      <svg:circle cx="12" cy="12" r="3" />
      <svg:path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1" />
    }
    @case ('chevron') { <svg:path d="m8 10 4 4 4-4" /> }
    @case ('edit') { <svg:path d="m14 5 5 5M4 20l3.5-.5L19 8a2.1 2.1 0 0 0-3-3L4.5 16.5z" /> }
    @case ('delete') { <svg:path d="M4 7h16M9 3h6l1 4H8zM7 7l1 14h8l1-14M10 11v6M14 11v6" /> }
    @case ('download') { <svg:path d="M12 3v12m0 0 4-4m-4 4-4-4M5 20h14" /> }
    @case ('plus') { <svg:path d="M12 5v14M5 12h14" /> }
    @case ('arrow-left') { <svg:path d="m15 18-6-6 6-6" /> }
    @case ('arrow-right') { <svg:path d="m9 18 6-6-6-6" /> }
  }
</svg>
