<header class="page-header">
  <div>
    <div class="kicker">FIRST RUN</div>
    <h1>Set up your internship</h1>
  </div>
  <p class="tagline">Five details. Then you’re ready.</p>
</header>

<section class="card setup-card">
  <div class="setup-intro">
    <span class="step-count">01</span>
    <div><h2>The basics</h2><p>Used in your weekly exports and report outline.</p></div>
  </div>
  <div class="setup-fields">
    <label class="field"><span>Company</span><input value="Studio Exemple" /></label>
    <label class="field"><span>Supervisor</span><input value="Yann Mbarga" /></label>
    <label class="field"><span>School</span><input value="ENSPD" /></label>
    <label class="field"><span>Start date</span><input class="mono" value="05 Oct 2026" /></label>
    <label class="field"><span>End date</span><input class="mono" value="18 Dec 2026" /></label>
  </div>
  <div class="setup-divider"></div>
  <div class="setup-intro">
    <span class="step-count">02</span>
    <div><h2>Your tags</h2><p>Use these to see where your time goes.</p></div>
  </div>
  <div class="editable-tags">
    @for (tag of tags; track tag) {
      <button type="button" class="editable-chip" title="Remove tag">{{ tag }} <span>×</span></button>
    }
    <button type="button" class="add-tag"><app-icon name="plus" [size]="15" /> Add a tag</button>
  </div>
  <div class="setup-footer">
    <p>You can change all of this later in Setup.</p>
    <a class="button primary" routerLink="/today">Start jotting</a>
  </div>
</section>
